[project]
name = "lidarprospector"
version = "0.0.1"
description = "Stream open airborne lidar, build bare-earth terrain, surface earthwork candidates"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "laspy[lazrs]",
    "pyproj",
    "requests",
    "matplotlib",
    "rasterio",
    "scikit-image",
    "scikit-learn",
    "psutil>=7.2.2",
    "pyshp>=3.1.8",
]
license = "Apache-2.0"
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: GIS"]

[project.optional-dependencies]
embed = ["torch"]

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lidarprospector"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY"]
ignore = ["E741"]  # l1/l2 eigenvalue names

[tool.pytest.ini_options]
testpaths = ["tests"]
# our own warnings are errors; ignore one upstream notice from affine (used inside rasterio.from_origin)
filterwarnings = [
    "error",
    "ignore:Use `@` matmul instead:PendingDeprecationWarning",
]
